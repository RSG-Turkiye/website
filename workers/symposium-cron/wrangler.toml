# A Worker whose only job is to trigger a rebuild of the symposium site on a schedule.
#
# The symposium site is static: which edition is "upcoming" is derived from the clock
# at build time. Without a scheduled rebuild, a symposium would stay "upcoming" even
# after it passed, until somebody happened to push a commit. This Worker ensures the
# site data stays current with the clock, not just the git log.
#
# The deploy hook is a secret (SYMPOSIUM_DEPLOY_HOOK) created in the rsg-symposium
# Cloudflare Pages project's Build settings. This Worker holds nothing else.

name = "rsg-symposium-cron"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Not published to a workers.dev subdomain. The `fetch` handler triggers the
# real action, so leaving it on the public internet would let anyone who found
# the URL fire it at will. Manual checks go through the Cloudflare dashboard's
# scheduled-event trigger, or `wrangler dev` locally.
workers_dev = false
# Preview URLs are a second public surface and default to on: with them
# enabled, every deployed version gets its own <version>-<name>.workers.dev
# address, which would undo the line above.
preview_urls = false


# 01:17 UTC is 04:17 in Türkiye -- after midnight local, so the day flips before
# the first visitor arrives. Off the hour to avoid Cloudflare's busiest cron minute.
[triggers]
crons = ["17 1 * * *"]
