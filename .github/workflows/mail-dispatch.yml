name: Dispatch scheduled mail

# Every 15 minutes. The odd minute is deliberate: everyone schedules on the
# hour, and GitHub's scheduler is most delayed there.
#
# TWO THINGS KEEP THIS ALIVE, and both are easy to break by accident:
#   1. GitHub runs a scheduled workflow as whoever last committed its cron.
#      This must be RSG's shared bot account -- if a personal account owns it
#      and later leaves the organisation, the schedule stops silently.
#   2. On a public repository, scheduled workflows are disabled after 60 days
#      with no repository activity. GitHub emails the owner; someone has to
#      re-enable it. A quiet stretch after the symposium is when this bites.
# The schedule lives in a Cloudflare Worker (workers/mail-cron/), not here.
# GitHub's scheduler never fired for this repo: four consecutive slots passed
# in silence while every manual run succeeded, with the workflow active, the
# file valid, Actions enabled and GitHub reporting no incident. Its scheduler
# is best-effort and deprioritises frequent crons on public repositories
# without saying so. Cloudflare runs its own cron triggers as part of the
# Worker's execution guarantee.
#
# This workflow stays as a manual "run now" button. Do NOT add `schedule:`
# back while the Worker exists — two schedulers against the same queue can
# each pick up the same due rows and send every message twice.
on:
  workflow_dispatch:

# Two runs against the same due rows send every message in the batch twice --
# dispatch.ts selects due rows and only deletes them after the send, so it
# holds no claim on a row while a request is in flight. cancel-in-progress is
# deliberately false: cancelling a run mid-send is exactly the failure mode
# this guards against (it would leave rows sent but not yet deleted, so the
# still-queued next run resends them). This still leaves the queue mail's own
# retry/give-up logic to do its job rather than papering over duplicate runs.
concurrency:
  group: mail-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Send due mail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the dispatch endpoint
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 300 \
            -X POST https://rsg-turkiye.iscbsc.org/api/mail/dispatch \
            -H "X-Dispatch-Secret: ${{ secrets.MAIL_SYNC_SECRET }}")
          cat /tmp/out.json
          echo
          if [ "$code" != "200" ]; then
            echo "dispatch returned HTTP $code"
            exit 1
          fi
