name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The sitemap's <lastmod> is the date of the commit
          # that last touched each file, so a shallow clone leaves almost
          # every URL undated and the test that guards it cannot tell that
          # from a regression.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      # Build first: the route-parity test reads dist/, and skips itself when
      # there is none. Running it before the build made it a test that always
      # passed in CI, which is the only place it needed to run.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  symposium-build:
    name: Symposium Build & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: symposium_website

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The sitemap's <lastmod> is the date of the commit
          # that last touched each file, so a shallow clone leaves almost
          # every URL undated and the test that guards it cannot tell that
          # from a regression.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: symposium_website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      # Build first: the route-parity test reads dist/, and skips itself when
      # there is none. Running it before the build made it a test that always
      # passed in CI, which is the only place it needed to run.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
