name = "website"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "rsg-members"
database_id = "ff7b1d7b-7bcc-4dc6-88d3-ade479ee2d08"

[[r2_buckets]]
binding = "BLOG_IMAGES"
bucket_name = "rsg-blog-images"

[[r2_buckets]]
binding = "MAIL_ATTACHMENTS"
bucket_name = "rsg-mail-attachments"

[vars]
GOOGLE_CLIENT_ID = "273051123979-t52aq69ueh1mji460qie6ip2j68c3agc.apps.googleusercontent.com"
PUBLIC_BLOG_IMAGES_URL = "https://rsg-turkiye.iscbsc.org/api/images"
# The LinkedIn Page the site posts as, by its public vanity name
# (linkedin.com/company/<this>). Connecting LinkedIn checks the signing-in
# member administers this Page. See README, "Social media and connections".
LINKEDIN_ORGANIZATION = "rsgturkey"
# The day the Buffer API key (Pages secret BUFFER_API_KEY) expires. Buffer
# keys last a year; the panel warns 14 days before and the admins get mail at
# 30, 14 and 3 days. A new key means a new date here. See README, "Buffer".
BUFFER_KEY_EXPIRES = "2027-10-19"
# Cloudflare Web Analytics, read by the admin Statistics section through the
# GraphQL API with the secret CF_ANALYTICS_TOKEN ("Account Analytics: Read").
# The account id is not a secret. WEB_ANALYTICS_SINCE is the day the beacon
# went live (YYYY-MM-DD); periods before it show a dash instead of a zero.
# See README, "Statistics".
CF_ACCOUNT_ID = "3408a71c05e0d833ff9ccd9750d249af"
WEB_ANALYTICS_SINCE = ""
# The address members' mail is sent from. Gmail accepts any address verified
# as a "send mail as" alias on the sending account, so switching to
# rsg-turkey@iscbsc.org once that alias works is a change to this line only --
# no code change. See README, "Sending mail as RSG".
RSG_MAIL_FROM = "turkey.rsg@gmail.com"
# GitHub username to notify (via a GitHub issue assigned to them) the
# moment a member submits a blog post -- must be a real person's account,
# never the same account GITHUB_PAT belongs to (GitHub never notifies an
# account about its own actions). Update this when leadership changes --
# see the README's Deployment section for the full explanation.
GITHUB_NOTIFY_USERNAME = "bogrum"
